name: Deploy docs to GitHub Pages

on:
  # PR でもビルドする。**ビルドが通ることの確認は PR で行いたい**——
  # main への push でしか走らないと、壊れたリンクは「PR は緑、main のデプロイが失敗」
  # という形で初めて表面化し、サイトの更新が止まる（#66 で指摘された）。
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv は floating major タグ (v9) を publish していないためパッチまで固定
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Build docs
        run: uv run mkdocs build

      # デプロイ用のアーティファクトは main への push のときだけ上げる
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
