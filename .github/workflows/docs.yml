name: Deploy docs to GitHub Pages

on:
  # PR でもビルドする。**ビルドが通ることの確認は PR で行いたい**——
  # main への push でしか走らないと、壊れたリンクは「PR は緑、main のデプロイが失敗」
  # という形で初めて表面化し、サイトの更新が止まる（#66 で指摘された）。
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # drawio を編集して SVG/PNG を書き出し直し忘れても、**差分を見ても気づけない**
      # （書き出しは差分に現れないので「変えていない」と見える）。ソースのハッシュを
      # diagrams/exports.json に記録して突き合わせる。ubuntu-latest 同梱の python3 と
      # 標準ライブラリだけで動くので、CI に draw.io CLI（+ xvfb）は入れない。
      - name: 図の鮮度をチェック
        run: python3 scripts/check-diagram-freshness.py

      # 歯止め自体が「置いてあるが何も見ていない」状態に退化していないかを確かめる
      - name: check-diagram-freshness.py のテスト
        run: python3 scripts/test-check-diagram-freshness.py

      # 「記録は新しいのに書き出しは古い」を作らないのは書き出し側の責任で、
      # 上のテストでは一切カバーされない（#50 の検証でこの経路の不具合が出た）。
      # draw.io CLI は呼ばず、偽の CLI を DRAWIO に差し込んで失敗の形を作る。
      - name: export-diagrams.py のテスト
        run: python3 scripts/test-export-diagrams.py

      # setup-uv は floating major タグ (v9) を publish していないためパッチまで固定
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Build docs
        run: uv run mkdocs build

      # デプロイ用のアーティファクトは main への push のときだけ上げる
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
