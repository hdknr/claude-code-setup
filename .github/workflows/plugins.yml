name: Check plugin catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # bump チェックは base との比較が必要なので全履歴を取る
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ubuntu-latest には python3 が同梱されており、スクリプトは標準ライブラリのみ。
      # action を増やすほど Node 非推奨 annotation の発生源も増えるので setup-python は使わない。
      - name: カタログと version の整合をチェック
        run: python3 scripts/check-plugin-versions.py

      # main への push では比較対象の base が曖昧なため、PR のときだけ実行する
      - name: version bump 漏れをチェック
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-version-bump.py "origin/${{ github.base_ref }}"

      # 差分が計画ファイルの「変更範囲」に収まっているか（#119）。base が要るので PR 限定。
      # 計画ファイルを持たない PR では「判定していない」と出して 0 で終わる。
      - name: 差分が計画の変更範囲に収まっているかチェック
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-plan-scope.py "origin/${{ github.base_ref }}"

      # 歯止め自体が「置いてあるが何も見ていない」状態に退化していないかを確かめる
      - name: check-plan-scope.py のテスト
        run: python3 scripts/test-check-plan-scope.py

      # description は 3 箇所に複製されている。片側だけ直す事故が #60 で 2 回起きたので、
      # 共変（どれかを直したら残りも直っている）を base との diff で見る。同じく PR 限定。
      - name: description の同期漏れをチェック
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-description-sync.py "origin/${{ github.base_ref }}"

      # 規範は SKILL.md にしか置かない（#75 / #94）。宣言は検査ではないので機械で見る。
      # push でも回す。base が要らない（1 つのツリーだけで判定できる）ので PR 限定にしない。
      - name: 必須マーカーが原本の外に漏れていないかチェック
        run: python3 scripts/check-norm-markers.py

      - name: 件数の食い違い（#138）
        run: python3 scripts/check-duplicate-counts.py

      # `**` の片側が句読点・反対側が文字だと、GitHub の描画で太字にならない（#525。決めた値は #537）。対象は plugins/ の Markdown。
      - name: 太字の flanking の崩れ（#525）
        run: python3 scripts/check-bold-flanking.py

      - name: スキルの中の指し先（#136）
        run: python3 scripts/check-skill-pointers.py

      # 計画ファイルの件数の行（dev-loop 手順 8）。周の途中の計画ファイルも見るので、PR の CI がマージ前の関門になる。
      - name: 計画ファイルの件数の行（#384）
        run: python3 scripts/check-plan-counts.py

      # ubuntu-latest の /bin/sh は dash。macOS 側は zsh / bash なので、
      # 両方で回すことで「片方のシェルだけで壊れる」類（#57 で実際に踏んだ）を止める。
      - name: link-skills.sh のテスト
        run: python3 scripts/test-link-skills.py

      # 歯止め自体が「置いてあるが何も見ていない」状態に退化していないかを確かめる
      - name: check-description-sync.py のテスト
        run: python3 scripts/test-check-description-sync.py

      # 「変わったか」ではなく「上がったか」を見ているか（#253）。本体は PR 限定だがテストは常に回す。
      - name: check-version-bump.py のテスト
        run: python3 scripts/test-check-version-bump.py

      - name: check-plugin-versions.py の版チェックのテスト
        run: python3 scripts/test-check-plugin-versions.py

      - name: check-norm-markers.py のテスト
        run: python3 scripts/test-check-norm-markers.py

      - name: check-duplicate-counts.py のテスト
        run: python3 scripts/test-check-duplicate-counts.py

      - name: check-bold-flanking.py のテスト
        run: python3 scripts/test-check-bold-flanking.py

      - name: worktree スクリプトのテスト（#136 段 3）
        run: python3 scripts/test-worktree-scripts.py

      - name: 周の探索のテスト（#136 段 1）
        run: python3 scripts/test-find-cycle.py

      # 本体は CI から呼ばない（入力が利用者の ~/.claude にある）。テストだけ回す。
      - name: 不在の前の環境点検のテスト（#394）
        run: python3 scripts/test-check-unattended-env.py
      - name: 長期トークンの起動口のテスト（#584）
        run: python3 scripts/test-launch-with-long-token.py

      - name: 複数 Issue の台帳のテスト（#390）
        run: python3 scripts/test-ledger.py

      - name: 親 Issue の一覧から台帳を作るテスト（#446）
        run: python3 scripts/test-parent-issue.py

      - name: 周を claude -p の子プロセスで回す起動口と要約のテスト（#491）
        run: python3 scripts/test-child-cycle.py

      - name: 重い検査・アプリの起動の順番待ちのテスト（#493）
        run: python3 scripts/test-run-serial.py

      - name: コードブロックとコメントの読み方の写し 3 つの突き合わせ（#758・#759・#760）
        run: python3 scripts/test-fence-copies.py

      - name: PR のマージの手続きのテスト（#389）
        run: python3 scripts/test-merge-pr.py

      - name: ガード拒否の収集のテスト（#122）
        run: python3 scripts/test-collect-guard-rejections.py

      # 本体は CI から呼べない（入力が ~/.claude/projects にある）。テストだけ回す。
      - name: 再開の周の作り直しの計数のテスト（#184）
        run: python3 scripts/test-count-resume-recreations.py

      # 本体は CI から呼べない（入力が ~/.claude/projects にある）。テストだけ回す。
      - name: 利用上限の後の継続の計数のテスト（#454）
        run: python3 scripts/test-count-usage-limit-resumes.py

      # 本体は CI から呼ばない（書く先が利用者の ~/.claude にある。hook として登録して使う）。テストだけ回す。
      - name: 利用上限の停止を記録する hook のテスト（#468）
        run: python3 scripts/test-record-stop-failure.py

      # 本体は CI から呼べない（claude を起こして課金する）。テストだけ回す。
      - name: dev-loop の Eval の実行と要約のテスト（#190）
        run: python3 scripts/test-run-dev-loop-evals.py

      - name: check-skill-pointers.py のテスト
        run: python3 scripts/test-check-skill-pointers.py

      - name: check-plan-counts.py のテスト
        run: python3 scripts/test-check-plan-counts.py

      # 本体は plugins/spec-loop/scripts/ にある（正本リポジトリで使う）。
      - name: spec-loop の Q&A 表の検査のテスト（#215）
        run: python3 scripts/test-check-qa-csv.py

      # 本体は plugins/spec-loop/scripts/ にある（req-loop が使う）。
      - name: spec-loop の PPTX 生成のテスト（#216）
        run: python3 scripts/test-qa-to-pptx.py

      # 本体は plugins/spec-loop/scripts/ にある（spec-review が使う）。
      - name: spec-loop の仕様レビューを抜ける条件の検査のテスト（#217）
        run: python3 scripts/test-check-spec-exit.py

      # 本体は plugins/spec-loop/scripts/ にある（feasibility・proposal が使う）。
      - name: spec-loop のスケジュールと見積りの表の検査のテスト（#218）
        run: python3 scripts/test-check-feasibility-csv.py

      - name: spec-loop のガントチャート生成のテスト（#218）
        run: python3 scripts/test-schedule-to-gantt.py

      - name: spec-loop のサインオフのタグの照合のテスト（#218）
        run: python3 scripts/test-check-signoff.py

      - name: spec-loop の提案書の生成のテスト（#218）
        run: python3 scripts/test-build-proposal.py

      # 本体は plugins/spec-loop/scripts/ にある（scaffold が使う）。
      - name: spec-loop の Red テストと Issue の本文の生成のテスト（#219）
        run: python3 scripts/test-scaffold.py

      # 本体は plugins/spec-loop/scripts/ にある（バージョンアップの差分を重ねる）。
      - name: spec-loop の版の重ね合わせのテスト（#261）
        run: python3 scripts/test-merge-versions.py

      # 同じテストを、大文字小文字を区別しない FS（ext4 の casefold）の上でもう 1 度回す（#571）——区別しない FS でだけ
      # 判別できる試料（git の index の綴りで読むもの）は、上の区別する FS では飛ばされる。印の環境変数があると、
      # 一時ディレクトリが区別する FS ならテストが赤になる（用意に失敗して黙って緑にならない）。
      # MkDocs のフックのテストも同じ形で回す（#514——綴り違いの表を前は区別しない FS でだけ描いていたので、番号を読む側の変異は
      # 区別しない FS でしか見分けられない）
      - name: spec-loop の版の重ね合わせ・MkDocs のフックのテスト（大文字小文字を区別しない FS。#571・#514）
        run: |
          truncate -s 512M "$RUNNER_TEMP/casefold.img"
          mkfs.ext4 -q -O casefold "$RUNNER_TEMP/casefold.img"
          sudo mkdir -p /mnt/casefold
          sudo mount -o loop "$RUNNER_TEMP/casefold.img" /mnt/casefold
          sudo mkdir /mnt/casefold/tmp
          sudo chattr +F /mnt/casefold/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/casefold/tmp
          TMPDIR=/mnt/casefold/tmp MERGE_VERSIONS_TEST_REQUIRE_CASE_FOLD=1 python3 scripts/test-merge-versions.py
          TMPDIR=/mnt/casefold/tmp MKDOCS_TEST_REQUIRE_CASE_FOLD=1 python3 scripts/test-init-mkdocs.py

      # 本体は plugins/spec-loop/scripts/ にある（ある版が前の版から何を足し・変え・消したか）。
      - name: spec-loop の版の差分のテスト（#263）
        run: python3 scripts/test-diff-versions.py

      # 本体は plugins/spec-loop/scripts/ にある（リリースした版が直されていないか）。
      - name: spec-loop の凍結した版の確かめのテスト（#262）
        run: python3 scripts/test-check-frozen.py

      # 本体は plugins/spec-loop/scripts/init-mkdocs.py と templates/mkdocs/（正本リポジトリへ写す雛形）。
      - name: spec-loop の MkDocs の雛形のテスト（#266）
        run: python3 scripts/test-init-mkdocs.py

      # 本体は plugins/orca・plugins/cmux の SKILL.md の共通手順ブロック（写しを作らず抜き出して流す）。
      - name: orca・cmux のタブ一致規則のテスト（#202）
        run: python3 scripts/test-tab-match.py

      # 散文で書かれた「この変異で赤になる」を機械で当てる（#151）。
      # 他の歯止めを子プロセスで回すので、1 本だけ重い。
      - name: 散文の変異主張を当てる（#151）
        run: python3 scripts/check-mutation-claims.py

      - name: check-mutation-claims.py のテスト
        run: python3 scripts/test-check-mutation-claims.py

      # 歯止めを 1 本ずつ選ばせないための入口（#117）。本体は CI から呼ばないが、
      # 「収録漏れ＝黙って 1 本落とす」を見るのはこのテストだけなので、テストは回す。
      - name: check-all.py のテスト
        run: python3 scripts/test-check-all.py
