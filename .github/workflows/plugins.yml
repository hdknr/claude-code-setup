name: Check plugin catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # bump チェックは base との比較が必要なので全履歴を取る
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ubuntu-latest には python3 が同梱されており、スクリプトは標準ライブラリのみ。
      # action を増やすほど Node 非推奨 annotation の発生源も増えるので setup-python は使わない。
      - name: カタログと version の整合をチェック
        run: python3 scripts/check-plugin-versions.py

      # main への push では比較対象の base が曖昧なため、PR のときだけ実行する
      - name: version bump 漏れをチェック
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-version-bump.py "origin/${{ github.base_ref }}"

      # 差分が計画ファイルの「変更範囲」に収まっているか（#119）。base が要るので PR 限定。
      # 計画ファイルを持たない PR では「判定していない」と出して 0 で終わる。
      - name: 差分が計画の変更範囲に収まっているかチェック
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-plan-scope.py "origin/${{ github.base_ref }}"

      # 歯止め自体が「置いてあるが何も見ていない」状態に退化していないかを確かめる
      - name: check-plan-scope.py のテスト
        run: python3 scripts/test-check-plan-scope.py

      # description は 3 箇所に複製されている。片側だけ直す事故が #60 で 2 回起きたので、
      # 共変（どれかを直したら残りも直っている）を base との diff で見る。同じく PR 限定。
      - name: description の同期漏れをチェック
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-description-sync.py "origin/${{ github.base_ref }}"

      # 規範は SKILL.md にしか置かない（#75 / #94）。宣言は検査ではないので機械で見る。
      # push でも回す。base が要らない（1 つのツリーだけで判定できる）ので PR 限定にしない。
      - name: 必須マーカーが原本の外に漏れていないかチェック
        run: python3 scripts/check-norm-markers.py

      - name: 件数の食い違い（#138）
        run: python3 scripts/check-duplicate-counts.py

      - name: スキルの中の指し先（#136）
        run: python3 scripts/check-skill-pointers.py

      # ubuntu-latest の /bin/sh は dash。macOS 側は zsh / bash なので、
      # 両方で回すことで「片方のシェルだけで壊れる」類（#57 で実際に踏んだ）を止める。
      - name: link-skills.sh のテスト
        run: python3 scripts/test-link-skills.py

      # 歯止め自体が「置いてあるが何も見ていない」状態に退化していないかを確かめる
      - name: check-description-sync.py のテスト
        run: python3 scripts/test-check-description-sync.py

      - name: check-plugin-versions.py の版チェックのテスト
        run: python3 scripts/test-check-plugin-versions.py

      - name: check-norm-markers.py のテスト
        run: python3 scripts/test-check-norm-markers.py

      - name: check-duplicate-counts.py のテスト
        run: python3 scripts/test-check-duplicate-counts.py

      - name: worktree スクリプトのテスト（#136 段 3）
        run: python3 scripts/test-worktree-scripts.py

      - name: 周の探索のテスト（#136 段 1）
        run: python3 scripts/test-find-cycle.py

      - name: ガード拒否の収集のテスト（#122）
        run: python3 scripts/test-collect-guard-rejections.py

      - name: check-skill-pointers.py のテスト
        run: python3 scripts/test-check-skill-pointers.py

      # 散文で書かれた「この変異で赤になる」を機械で当てる（#151）。
      # 他の歯止めを子プロセスで回すので、1 本だけ重い。
      - name: 散文の変異主張を当てる（#151）
        run: python3 scripts/check-mutation-claims.py

      - name: check-mutation-claims.py のテスト
        run: python3 scripts/test-check-mutation-claims.py

      # 歯止めを 1 本ずつ選ばせないための入口（#117）。本体は CI から呼ばないが、
      # 「収録漏れ＝黙って 1 本落とす」を見るのはこのテストだけなので、テストは回す。
      - name: check-all.py のテスト
        run: python3 scripts/test-check-all.py
