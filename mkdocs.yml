site_name: Claude Code 設定
site_description: Claude Code をインストールして使えるようにするための手順書
site_url: https://hdknr.github.io/claude-code-setup/

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

# 警告を失敗として扱う。**設定に書くのが要点**——CI もローカルも `mkdocs build` を
# そのまま叩くので、`--strict` を渡す運用にすると付け忘れた場所だけ守られなくなる。
# 実際 #66 の周で、`validation` だけ足して CI に `--strict` が無いことを見落とした。
strict: true

# アンカー切れは既定が info 止まりで、strict でも落ちない。warn に上げて初めて効く。
# #66 では、日本語見出しへのリンク（ASCII スラグ化で id が空になる）が緑のまま残った。
validation:
  anchors: warn

nav:
  - ホーム: index.md
  - 概要: overview.md
  - macOS:
    - Part 1 - 事前準備: macos/part1-preparation.md
    - Part 2 - Claude Code インストール: macos/part2-installation.md
  - Windows:
    - ネイティブ Windows:
      - Part 1 - 事前準備: windows/part1-preparation.md
      - Part 2 - Claude Code インストール: windows/part2-installation.md
    - WSL2 (Ubuntu):
      - Part 1 - 事前準備: windows/wsl2-part1-preparation.md
      - Part 2 - Claude Code インストール: windows/wsl2-part2-installation.md
      - Part 3 - インストール後の環境準備: windows/wsl2-part3-post-setup.md
    - 補足 - Claude Desktop から WSL を使う: windows/claude-desktop-wsl.md
  - Part 3 - インストール後の環境準備（共通）: part3-post-setup.md
  - Claude Codeの使い方:
    - 基本概念: usage/concepts.md
    - なぜ GitHub を使うのか: usage/why-github.md
    - 基本操作とスラッシュコマンド: usage/basic-operations.md
    - 実行モードと権限管理: usage/execution-modes.md
    - CLAUDE.md の使い方: usage/claude-md.md
    - スキル活用ガイド: usage/skills-guide.md
  - Claude Codeの高度な使い方:
    - 拡張機能: usage/advanced-extensions.md
    - トークン最適化: usage/advanced-token-management.md
  - プラグイン:
    - プラグイン一覧: plugins/index.md
    - dev-loop の設計（ループ志向開発）: plugins/dev-loop-design.md
  - ツール解説:
    - Docker をやさしく理解する: tools/docker.md
    - GitHub をやさしく理解する: tools/github/index.md
    - SSH と鍵ファイル:
      - SSH と鍵ファイルをやさしく理解する: tools/ssh/index.md
      - Windows での SSH 鍵ファイル管理: tools/ssh/windows.md
  - 事例集:
    - 事例集について: cases/index.md
    - WordPress (xserver) を Claude Code で管理:
      - 全体像: cases/wp-xserver/index.md
      - 1. ゴールと全体フロー: cases/wp-xserver/01-overview.md
      - 2. フォルダ作成と plan.md: cases/wp-xserver/02-prepare-folder.md
      - 3. GitHub リポジトリの用意: cases/wp-xserver/03-github-repo.md
      - 4. plan.md から Issue を作る: cases/wp-xserver/04-issue-creation.md
      - 5. Issue で対話する: cases/wp-xserver/05-issue-dialogue.md
      - 6. SSH 接続を設定する: cases/wp-xserver/06-ssh-setup.md
      - 7. xserver の内容を GitHub に取り込む: cases/wp-xserver/07-xserver-to-github.md
      - 8. Docker で stage 環境: cases/wp-xserver/08-stage-docker.md
      - 9. 修正と PR: cases/wp-xserver/09-edit-and-pr.md
      - 10. xserver にデプロイ: cases/wp-xserver/10-deploy-xserver.md
      - 11. トラブルシュート: cases/wp-xserver/11-troubleshooting.md
  - 付録 - 便利リンク集: appendix-links.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # mermaid を図としてレンダリングする（未設定だとコードブロック表示になる）
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
